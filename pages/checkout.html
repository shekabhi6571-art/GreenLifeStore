<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | GreenLife</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"></head><body><div id="site-header"></div><main class="page-shell"><div class="breadcrumbs">Home / Checkout</div><div class="page-hero"><div><p class="eyebrow">A simple, secure finish</p><h1>Complete your <em>order.</em></h1></div></div><div class="checkout-layout"><section><div class="checkout-steps"><div class="checkout-step active">01 Delivery</div><div class="checkout-step">02 Payment</div><div class="checkout-step">03 Confirmation</div></div><form id="checkout-form"><div class="form-card"><h2>Delivery details</h2><div class="form-grid"><div class="form-field"><label for="customer-name">Full name</label><input id="customer-name" name="customer-name" required minlength="2"></div><div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="form-field full"><label for="address">Address</label><textarea id="address" name="address" rows="3" required minlength="8"></textarea></div></div></div><div class="form-card"><h2>Payment method</h2><div class="form-field"><select id="payment" name="payment"><option value="COD">Cash on delivery</option><option value="UPI">UPI payment</option><option value="Card">Card payment</option></select></div></div><button class="button button-dark" type="submit">Place order <i data-lucide="arrow-right"></i></button></form></section><aside class="order-card"><h2>Your bag</h2><div id="checkout-items"></div><div class="promo"><input id="promo-code" placeholder="Promo code"><button id="apply-promo" type="button">Apply</button></div><div class="order-total"><span>Total</span><strong id="checkout-total">Rs. 0</strong></div><small>Guest checkout available. No account required.</small></aside></div></main><div id="site-footer"></div><script src="https://unpkg.com/lucide@latest"></script><script src="js/pages.js"></script><script src="js/checkout.js"></script></body></html>
