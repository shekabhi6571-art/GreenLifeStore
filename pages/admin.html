<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin dashboard | GreenLife</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"></head><body><div id="site-header"></div><main class="page-shell"><div class="page-hero"><div><p class="eyebrow">GreenLife operations</p><h1>Admin <em>dashboard.</em></h1><p>Manage the collection, keep orders moving, and understand what customers love.</p></div><button class="button button-dark" id="refresh-admin"><i data-lucide="refresh-cw"></i>Refresh data</button></div><div class="dashboard-grid"><div class="metric"><small>Total revenue</small><strong id="metric-revenue">Rs. 0</strong></div><div class="metric"><small>Orders</small><strong id="metric-orders">0</strong></div><div class="metric"><small>Products</small><strong id="metric-products">0</strong></div><div class="metric"><small>Low stock</small><strong id="metric-stock">0</strong></div></div><div class="admin-layout"><section class="admin-card"><h2>Add product</h2><form id="product-form" class="form-grid"><div class="form-field full"><label>Name</label><input name="name" required></div><div class="form-field"><label>Category</label><input name="category" value="Pantry" required></div><div class="form-field"><label>Brand</label><input name="brand" value="GreenLife Makers" required></div><div class="form-field"><label>Price</label><input name="price" type="number" min="0" required></div><div class="form-field"><label>Stock</label><input name="stock" type="number" min="0" value="10" required></div><div class="form-field"><label>Unit</label><input name="unit" value="1 piece" required></div><div class="form-field"><label>Tag</label><input name="tag" value="New" required></div><div class="form-field full"><label>Image URL</label><input name="image" type="url" required></div><div class="form-field full"><label>Description</label><textarea name="description" rows="3" required>Thoughtfully sourced organic essential for everyday living.</textarea></div><button class="button button-dark" type="submit">Add product</button></form><p id="admin-message"></p></section><section class="admin-card"><h2>Recent orders</h2><div id="orders-table">Loading orders...</div></section></div></main><div id="site-footer"></div><script src="https://unpkg.com/lucide@latest"></script><script src="js/pages.js"></script><script src="js/admin.js"></script></body></html>
